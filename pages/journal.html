<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ジャーナル履歴 — Mirai Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .journal-entry { padding: 1rem; border-bottom: 1px solid var(--border); }
    .journal-entry:last-child { border-bottom: none; }
    .journal-entry-date { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .journal-entry-text { font-size: 13px; color: var(--text-primary); line-height: 1.7; white-space: pre-wrap; }
    .journal-entry-summary { font-size: 12px; color: var(--accent-blue); margin-top: 8px; padding: 8px; background: var(--bg-base); border-radius: 6px; }
    .journal-entry-tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon"><i class="ti ti-compass"></i></span>
          <span class="logo-text">Mirai<br><em>Journal</em></span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">メイン</div>
        <a href="../index.html" class="nav-item"><i class="ti ti-layout-dashboard"></i><span>ダッシュボード</span></a>
        <a href="journal.html" class="nav-item active"><i class="ti ti-pencil"></i><span>ジャーナル履歴</span></a>
        <a href="goals.html" class="nav-item"><i class="ti ti-target"></i><span>目標一覧</span></a>
        <a href="analysis.html" class="nav-item"><i class="ti ti-chart-radar"></i><span>自己分析</span></a>
        <a href="trends.html" class="nav-item"><i class="ti ti-world-search"></i><span>トレンド記録</span></a>
        <a href="career.html" class="nav-item"><i class="ti ti-rocket"></i><span>キャリア候補</span></a>
        <a href="weekly.html" class="nav-item"><i class="ti ti-calendar-stats"></i><span>週次レポート</span></a>
        <div class="nav-section-label">このアプリ</div>
        <a href="settings.html" class="nav-item"><i class="ti ti-info-circle"></i><span>このアプリについて</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle" id="menuToggle"><i class="ti ti-menu-2"></i></button>
        <div class="header-title">
          <h1>ジャーナル履歴</h1>
          <span class="header-date" id="headerDate"></span>
        </div>
      </header>

      <div class="content-body">
        <div class="alert alert-info" style="margin-bottom:1rem;font-size:13px;line-height:1.7;">
          新しいジャーナルは、このページからは記録できません。<strong>Gemini Live面談 → claude-voice-bridgeの「ジャーナル面談」タブ → Claude Codeへ貼り付けて分析依頼</strong>という手順で記録されます。
          詳しくは<a href="settings.html" style="color:inherit;text-decoration:underline;">このアプリについて</a>を参照してください。
        </div>

        <div class="card">
          <div class="card-header">
            <h2><i class="ti ti-history"></i>記録一覧</h2>
            <span style="font-size:12px;color:var(--text-muted);" id="entryCount"></span>
          </div>
          <div id="journalList">
            <div class="empty-state"><i class="ti ti-loader-2"></i><p>読み込み中...</p></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const toggle = document.getElementById('menuToggle');
      const sidebar = document.getElementById('sidebar');
      if (toggle && sidebar) toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
      const dateEl = document.getElementById('headerDate');
      if (dateEl) dateEl.textContent = new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

      try {
        await Data.init();
        render(Data.getJournals());
      } catch (e) {
        document.getElementById('journalList').innerHTML =
          `<div class="empty-state"><i class="ti ti-alert-triangle"></i><p>データの読み込みに失敗しました<br>${esc(e.message)}</p></div>`;
      }
    });

    function render(journals) {
      const el = document.getElementById('journalList');
      const countEl = document.getElementById('entryCount');
      if (countEl) countEl.textContent = `計${journals.length}件`;
      if (!journals.length) {
        el.innerHTML = '<div class="empty-state"><i class="ti ti-pencil-off"></i><p>まだ記録がありません</p></div>';
        return;
      }
      const sorted = [...journals].sort((a, b) => new Date(b.date) - new Date(a.date));
      el.innerHTML = sorted.map(j => {
        const a = j.analysis || null;
        return `
        <div class="journal-entry">
          <div class="journal-entry-date">${new Date(j.date).toLocaleString('ja-JP')}</div>
          <div class="journal-entry-text">${esc(j.rawTranscript || '')}</div>
          ${a && a.summary ? `<div class="journal-entry-summary">📝 ${esc(a.summary)}</div>` : ''}
          ${a && (a.tags || []).length ? `<div class="journal-entry-tags">${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          ${!a ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;">(まだ分析されていません)</div>` : ''}
        </div>
        `;
      }).join('');
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
